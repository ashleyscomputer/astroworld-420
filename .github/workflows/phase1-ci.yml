name: Phase 1 checks
on:
  pull_request:
    branches: [main, feature/foundation]
  push:
    branches: [feature/foundation, feature/rbac]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - name: Lint Phase 1 additions
        run: npx eslint scripts/bootstrap-password.mjs tests/*.test.mjs
      - name: Report existing lint debt
        continue-on-error: true
        run: npm run lint
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: node --experimental-strip-types scripts/verify-firebase-tokens.mjs
