<style>
:root{--bg:#000;--hint:rgba(255,255,255,.55);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:grid;place-items:center;overflow:hidden;cursor:crosshair;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.logo{position:relative;width:min(94vmin,980px);aspect-ratio:1;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.logo>*{position:absolute}
.base{inset:0;width:100%;height:100%;mix-blend-mode:screen;animation:pulse 3.4s ease-in-out infinite}
.intro .base{animation:rise 1.6s ease-out both,pulse 3.4s 1.6s ease-in-out infinite}
.sweep{inset:0;mix-blend-mode:screen;-webkit-mask:radial-gradient(circle closest-side,transparent 91%,#000 94%,#000 98%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 91%,#000 94%,#000 98%,transparent 100%)}
.sweep i{position:absolute;inset:0;background:conic-gradient(transparent 0 60%,rgba(255,255,255,.95) 80%,transparent 92%);animation:spin 4.6s linear infinite}
.sweep i+i{animation-delay:-2.3s;opacity:.55}
.intro .sweep{animation:fade 1s 1.3s both}
.sub{left:20%;top:55.8%;width:60%;height:5%;mix-blend-mode:overlay;overflow:hidden}
.sub i{position:absolute;top:0;bottom:0;width:30%;left:-30%;background:linear-gradient(100deg,transparent,#fff,transparent);animation:shine 4.5s 2s ease-in-out infinite}
.fl{width:9%;aspect-ratio:1;translate:-50% -50%;mix-blend-mode:screen;background:radial-gradient(circle,#fff 0 5%,transparent 28%),linear-gradient(#0000 46%,#fff 50%,#0000 54%),linear-gradient(90deg,#0000 46%,#fff 50%,#0000 54%);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:fl 2.8s var(--d,0s) ease-in-out infinite}
.l{mix-blend-mode:screen}
.intro .l{animation:drop .9s cubic-bezier(.2,1.5,.4,1) calc(var(--i)*70ms + 500ms) both}

.live .w{animation:wave 3.2s ease-in-out calc(var(--i)*-.2s) infinite}
.live .f{animation:glow 4s ease-in-out calc(var(--i)*-.25s) infinite}
.g .f{animation:spinG 32s linear infinite}
.live .g .f{animation:spinG 32s linear infinite,glow 4s ease-in-out calc(var(--i)*-.25s) infinite}

@keyframes spinG{to{transform:rotate(360deg)}}
@keyframes pulse{50%{filter:brightness(1.2) saturate(1.2)}}
@keyframes rise{from{opacity:0;filter:brightness(2.5);transform:scale(1.08)}to{opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes drop{0%{transform:translateY(-160%) rotate(-14deg) scale(.5);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
@keyframes wave{50%{transform:translateY(-4%) rotate(1.2deg)}}
@keyframes glow{50%{filter:brightness(1.45) saturate(1.25)}}
@keyframes tun{0%{transform:scale(.7);opacity:0}25%{opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes shine{0%{left:-30%}55%,100%{left:110%}}
@keyframes fl{0%,100%{transform:scale(.4) rotate(0);opacity:.15}50%{transform:scale(1.15) rotate(25deg);opacity:1}}
